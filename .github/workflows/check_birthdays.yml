name: Check birthdays

on:
  schedule:
    # 06:00 UTC = 08:00 Europe/Amsterdam tijdens zomertijd (CEST, UTC+2)
    - cron: '0 6 * * *'
    # 07:00 UTC = 08:00 Europe/Amsterdam tijdens wintertijd (CET, UTC+1)
    - cron: '0 7 * * *'
  workflow_dispatch: {}  # handmatig te triggeren vanuit de Actions tab, handig om te testen

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout birthday data (private repo)
        uses: actions/checkout@v4
        with:
          repository: martinrog/birthday-list
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: _data

      - name: Provide birthday data
        run: cp _data/birthdays.json birthdays.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check birthdays and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_birthdays.py
